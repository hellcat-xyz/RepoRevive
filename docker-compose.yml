services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: reporevive
      POSTGRES_PASSWORD: reporevive
      POSTGRES_DB: reporevive
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U reporevive']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
